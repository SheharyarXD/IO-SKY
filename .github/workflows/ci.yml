name: CI

# Minimal Phase 1 CI foundation (Milestone 1 / RM-19): install, typecheck,
# test. This is intentionally small — full build/deploy automation is
# Milestone 3 scope (see PHASE1_CHECKLIST.md). The goal here is only to
# make sure nothing merges to main without at least compiling and passing
# the existing test suite.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the "packageManager" field in package.json so the pnpm
      # version actually used matches what's pinned there, regardless of
      # the separate (and currently mismatched) `pnpm` devDependency range.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test
